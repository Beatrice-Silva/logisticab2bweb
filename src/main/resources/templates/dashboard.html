<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - EntreExpress</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <div th:replace="~{fragments/head :: head}"></div>
</head>

<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container">
  <h1 class="titulo">Visão Geral</h1>
  <div class="grid">
    <div class="card"><div class="card-titulo">Criados</div><h2 th:text="${counts['CRIADO']?:0}">0</h2><span class="badge badge-azul">Aguardando coleta</span></div>
    <div class="card"><div class="card-titulo">Coletados</div><h2 th:text="${counts['COLETADO']?:0}">0</h2><span class="badge badge-laranja">Coletado</span></div>
    <div class="card"><div class="card-titulo">Em Trânsito</div><h2 th:text="${counts['EM_TRANSITO']?:0}">0</h2><span class="badge badge-laranja">Em rota</span></div>
    <div class="card"><div class="card-titulo">Entregues</div><h2 th:text="${counts['ENTREGUE']?:0}">0</h2><span class="badge badge-verde">Finalizado</span></div>
    <div class="card"><div class="card-titulo">Devolvidos</div><h2 th:text="${counts['DEVOLVIDO']?:0}">0</h2><span class="badge badge-vermelho">Cancelado</span></div>
    <div class="card"><div class="card-titulo">Arquivados</div><h2 th:text="${counts['ARQUIVADO']?:0}">0</h2><span class="badge badge-cinza">Arquivado</span></div>
  </div>

  <div class="card" style="margin-top:20px">
    <h3 class="titulo">Por Loja</h3>
    <table class="table">
        <tr th:each="item : ${porLoja}">
            <td th:text="${item.nomeLoja}"></td>
            <td th:text="${item.total}"></td>
        </tr>
    </table>
  </div>
</div>
</body>
</html>
