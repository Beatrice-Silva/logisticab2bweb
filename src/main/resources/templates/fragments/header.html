<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="header">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .navbar-logistica{background:#fff; border-bottom:1px solid #e2e8f0}
    .nav-link-logistica{font-weight:600; color:#475569; padding:8px 14px!important; border-radius:10px}
    .nav-link-logistica:hover, .nav-link-logistica.active{background:#f1f5f9; color:#1e2a5e}
    .btn-orange{background:#f97316; color:#fff; font-weight:700; border-radius:10px; padding:8px 16px}
    .btn-orange:hover{background:#ea580c; color:#fff}
    .search-box{background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:6px 12px}
    .search-box input{border:0; background:transparent; outline:none; font-size:14px; width:200px}
  </style>

  <nav class="navbar navbar-expand-lg navbar-logistica sticky-top px-3 py-2">
    <div class="container-fluid">
      <!-- LOGO -->
      <a class="navbar-brand fw-bolder d-flex align-items-center gap-2" th:href="@{/dashboard}" style="color:#1e2a5e">
        <span class="bg-primary bg-opacity-10 rounded-3 p-2 d-flex"><i class="bi bi-box-seam-fill"></i></span>
        EntreExpress
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLogistica">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navLogistica">
        <!-- LINKS CENTRAIS - COM ICONES -->
        <ul class="navbar-nav me-auto ms-lg-4 gap-1">
          <li class="nav-item">
            <a class="nav-link nav-link-logistica" th:href="@{/pacotes}"><i class="bi bi-box"></i> Pacotes</a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-link-logistica" th:href="@{/lojas}"><i class="bi bi-shop"></i> Lojas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-link-logistica" th:href="@{/lojas/arquivadas}"><i class="bi bi-archive"></i> Arquivadas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-link-logistica" th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
          
          <!-- BUSCA GLOBAL - FILTRA LOJAS/PACOTES -->
          <div class="search-box d-none d-md-flex align-items-center gap-2">
            <i class="bi bi-search text-muted"></i>
            <input type="text" placeholder="Buscar código, loja..." onkeyup="if(window.filtrarLoja) filtrarLoja(); if(window.filtrarPacotes) filtrarPacotes()">
          </div>

          <a th:href="@{/pacotes/novo}" class="btn btn-orange btn-sm">
            <i class="bi bi-plus-lg"></i> Nova Remessa
          </a>

         
          <a th:href="@{/lojas/nova}" class="btn btn-outline-dark btn-sm rounded-3 fw-semibold">
            <i class="bi bi-shop-window"></i> Nova Loja
          </a>

          <div class="vr mx-1 d-none d-lg-block"></div>

          <!-- DESLOGAR COM AVATAR -->
          <div class="dropdown">
            <button class="btn btn-light rounded-3 d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
              <div class="bg-dark text-white rounded-circle d-flex align-items-center justify-content-center" style="width:28px;height:28px"><i class="bi bi-person"></i></div>
              <i class="bi bi-chevron-down small"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end rounded-3 shadow">
              <li><span class="dropdown-item-text small text-muted">Logado como Operador</span></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" th:href="@{/login}"><i class="bi bi-box-arrow-right"></i> Deslogar</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>
</div>
</body>

              <li class="nav-item">
                  <a class="nav-link text-white" aria-current="page" th:href="@{/index}">Página inicial</a>
              </li>
              
              <li class="nav-item">
                  <a class="nav-link text-white" aria-current="page" th:href="@{/dashboard}">dashboard</a>
              </li>
          </ul>
          
      </nav>
      
  </header>
  -->
  

</html>
