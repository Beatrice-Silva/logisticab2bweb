<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
    <title>Login - LogisticaWeb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
        <style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }
    nav { background:#1E3A8A; padding:16px 32px; display:flex; justify-content:space-between; align-items:center; }
    nav a { color:white; text-decoration:none; margin-right:24px; font-weight:500; }
    nav a:hover { color:#FF6B00; }
    .btn-sair { background:#FF6B00; color:white; border:none; padding:8px 16px; border-radius:4px; cursor:pointer; font-weight:bold; }
    .container { max-width:1100px; margin:32px auto; padding:0 16px; }
    .card { background:white; padding:24px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.08); border-left:4px solid #1E3A8A; margin-bottom:20px; }
    .card-login { max-width:420px; margin:80px auto; text-align:center; border-left:none; }
    .titulo { font-size:22px; color:#1E3A8A; margin-bottom:24px; font-weight:bold; }
    .grupo { text-align:left; margin-bottom:16px; }
    .grupo label { display:block; margin-bottom:6px; font-weight:600; font-size:14px; }
    .grupo input, .grupo select { width:100%; padding:12px; border:1px solid #CBD5E1; border-radius:4px; font-size:15px; }
    .botao { width:100%; padding:12px; background:#1E3A8A; color:white; border:none; border-radius:4px; font-weight:bold; font-size:16px; cursor:pointer; margin-top:12px; }
    .botao:hover { background:#152a65; }
    .botao-laranja { background:#FF6B00; }
    .botao-laranja:hover { background:#d95800; }
    </style> 
    </head>  
<body>
   <nav>
       <a class="icon-link" th:href="@{/index}">Voltar</a>
        <a class="icon-link" href="@{/}" style="color:orange">Serviço: EntreExpress</a>
        <nav class="d-flex justify-content-center-between p-3 bg-secondarys"></nav>
    </nav>  
    <div class="card card-login">
        <h1 class="titulo">Sistema Logístico de rastreamento</h1>
        <form th:action="@{/logar}" th:object="${credenciais}" method="post">
             <div th:if="${sucesso}" style="color:darkgreen;background:#bbf7d0;padding:12px;border-radius:6px;margin-bottom:15px">
            <span th:text="${sucesso}"></span>
            </div>
            <div class="grupo">
                <label>E-mail:</label>
                <input type="email" th:field="*{email}" class="campo" placeholder="admin@logistica.com" required>
            </div>
            <div class="grupo">
                <label>Senha:</label>
                <input type="password" th:field="*{senha}" class="campo" placeholder="admin123" required>
            </div> 
            <button style="width:100%" type="submit" class="botao">Logar</button>
        </form>
        <br><br>
        <p>Não possui uma conta ainda?
        <a class="botao" th:href="@{/registrar}" style="color:darkblue; background:lightgrey"> Comece aqui</a>
        </p>
        <div th:if="${param.erro}" class="alert alert-danger" style="color:darkred; background:salmon; padding:12px; border-radius:6px; margin-top:15px"> 
            E-mail ou senha inválidos
        </div>
        <p style="color:grey; background:lightgrey; padding:12px; border-radius:6px; margin-top:15px">
            Usuário público pode acessar status e confirmação da remessa através de código fornecido<br>    
            <br>
        <a class="botao" th:href="@{/pacotes/rastrear}" style=" color:white; background:orange; display:block; text-align:center; text-decoration:none">
        Verificação por código
        </a>
        </p>
    </div>
</body>
</html>
