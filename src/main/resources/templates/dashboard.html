<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - EntreExpress</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body{background:#f8fafc}
    .card-stat{border:0; border-radius:20px}
    .icon-box{width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:12px}
  </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div style="background: linear-gradient(135deg, #1e2a5e 0%, #2a4ab7 100%)" class="text-white">
  <div class="container py-4">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
      <div>
        <h2 class="fw-bold mb-1"><i class="bi bi-speedometer2"></i> Visão Geral</h2>
        <p class="mb-0 text-white-50 small">Acompanhe seus pacotes em tempo real</p>
      </div>
      <div class="d-flex gap-2">
        <a href="/pacotes/novo" class="btn btn-light rounded-3 fw-semibold"><i class="bi bi-plus-lg"></i> Nova remessa</a>
      </div>
    </div>
  </div>
</div>

<div class="container py-4">

  <!-- CARDS COM PROTEÇÃO CONTRA NULO -->
  <div class="row g-3">
    <div class="col-6 col-lg-2">
      <div class="card h-100 shadow-sm border-0 rounded-4">
        <div class="card-body p-3">
          <div class="icon-box bg-primary bg-opacity-10 text-primary"><i class="bi bi-box"></i></div>
          <small class="text-muted fw-semibold">Criados</small>
          <h3 class="fw-bold mb-0" th:text="${counts != null and counts['CRIADO'] != null ? counts['CRIADO'] : 0}">0</h3>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-2">
      <div class="card h-100 shadow-sm border-0 rounded-4">
        <div class="card-body p-3">
          <div class="icon-box bg-warning bg-opacity-10 text-warning"><i class="bi bi-truck"></i></div>
          <small class="text-muted fw-semibold">Coletados</small>
          <h3 class="fw-bold mb-0" th:text="${counts != null and counts['COLETADO'] != null ? counts['COLETADO'] : 0}">0</h3>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-2">
      <div class="card h-100 shadow-sm border-0 rounded-4" style="border:1px solid #ffedd5 !important">
        <div class="card-body p-3">
          <div class="icon-box" style="background:#fff7ed; color:#f97316"><i class="bi bi-send"></i></div>
          <small class="text-muted fw-semibold">Em Trânsito</small>
          <h3 class="fw-bold mb-0" th:text="${counts != null and counts['EM_TRANSITO'] != null ? counts['EM_TRANSITO'] : 0}">0</h3>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-2">
      <div class="card h-100 shadow-sm border-0 rounded-4">
        <div class="card-body p-3">
          <div class="icon-box bg-success bg-opacity-10 text-success"><i class="bi bi-check2-circle"></i></div>
          <small class="text-muted fw-semibold">Entregues</small>
          <h3 class="fw-bold mb-0" th:text="${counts != null and counts['ENTREGUE'] != null ? counts['ENTREGUE'] : 0}">0</h3>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-2">
      <div class="card h-100 shadow-sm border-0 rounded-4">
        <div class="card-body p-3">
          <div class="icon-box bg-danger bg-opacity-10 text-danger"><i class="bi bi-arrow-return-left"></i></div>
          <small class="text-muted fw-semibold">Devolvidos</small>
          <h3 class="fw-bold mb-0" th:text="${counts != null and counts['DEVOLVIDO'] != null ? counts['DEVOLVIDO'] : 0}">0</h3>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-2">
      <div class="card h-100 shadow-sm border-0 rounded-4">
        <div class="card-body p-3">
          <div class="icon-box bg-secondary bg-opacity-10 text-secondary"><i class="bi bi-archive"></i></div>
          <small class="text-muted fw-semibold">Arquivados</small>
          <h3 class="fw-bold mb-0" th:text="${counts != null and counts['ARQUIVADO'] != null ? counts['ARQUIVADO'] : 0}">0</h3>
        </div>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm rounded-4 mt-4">
    <div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0"><i class="bi bi-shop"></i> Desempenho por Loja</h5>
        <div class="d-flex gap-2">
          <input id="buscaLoja" onkeyup="filtrarLoja()" type="text" placeholder="Buscar loja..." class="form-control form-control-sm" style="width:180px">
        </div>
      </div>
      
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0" id="tabelaLojas">
          <thead class="table-light">
            <tr class="small text-muted">
              <th>Loja</th>
              <th>Total</th>
              <th style="width:40%">Distribuição</th>
              <th class="text-end">Ação</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="item : ${porLoja}" th:if="${porLoja != null}">
              <td><b th:text="${item.nomeLoja}">Loja Centro</b></td>
              <td><span class="badge bg-dark rounded-pill" th:text="${item.total}">12</span></td>
              <td>
                <div class="progress" style="height:6px">
                  <!-- CORREÇÃO: sintaxe de width com Thymeleaf literal -->
                  <div class="progress-bar" style="background:#1e2a5e" th:style="|width: ${item.total * 5}%|"></div>
                </div>
              </td>
              <td class="text-end">
                <a th:href="@{/pacotes/loja/{id}(id=${item.idLoja})}" class="btn btn-sm btn-outline-primary rounded-3">
                  Ver pacotes
                </a>
              </td>
            </tr>
            <tr th:if="${porLoja == null or #lists.isEmpty(porLoja)}">
              <td colspan="4" class="text-center text-muted py-4">Nenhuma loja cadastrada ainda</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
function filtrarLoja(){
  let termo = document.getElementById('buscaLoja').value.toLowerCase();
  document.querySelectorAll('#tabelaLojas tbody tr').forEach(tr=>{
    if(tr.querySelector('td')){ // ignora linha vazia
      tr.style.display = tr.innerText.toLowerCase().includes(termo) ? '' : 'none';
    }
  });
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
