<html xmlns:th="http://www.thymeleaf.org">

<head><link rel="stylesheet" th:href="@{/css/style.css}"><title>Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
    * { 
        margin:0; 
        padding:0; 
        box-sizing:border-box; 
        font-family:'Segoe UI', Arial, sans-serif; 
    }
    body {
        background:#F5F7FA; 
        color:#1E293B; 
        min-height:100vh; 
    }
    
    nav { 
        background:#1E3A8A; 
        padding:16px 32px; 
        display:flex; 
        justify-content:space-between; 
        align-items:center; 
    }
    nav a { 
        color:white; 
        text-decoration:none; 
        margin-right:24px; 
        font-weight:500; 
    }
    nav a:hover { 
        color:#FF6B00; 
    }
    .btn-sair { 
        background:#FF6B00; 
        color:white; border:none; 
        padding:8px 16px; 
        border-radius:4px; 
        cursor:pointer; 
        font-weight:bold; 
    }
    .container { 
        max-width:1100px; 
        margin:32px auto; 
        padding:0 16px; 
    }
    .card { 
        background:white; 
        padding:24px; 
        border-radius:8px; 
        box-shadow:0 2px 6px rgba(0,0,0,0.08); 
        border-left:4px solid #1E3A8A; 
        margin-bottom:20px; 
    }
    
    .card-login { 
        max-width:420px; 
        margin:80px auto; 
        text-align:center; 
        border-left:none; 
    }
    .titulo { 
        font-size:22px; 
        color:#1E3A8A; 
        margin-bottom:24px; 
        font-weight:bold; 
    }
    .grupo { 
        text-align:left; 
        margin-bottom:16px; 
    }
    .grupo label { 
        display:block; 
        margin-bottom:6px;
        font-weight:600; 
        font-size:14px; 
    }
    .grupo input, .grupo select { 
        width:100%; 
        padding:12px; 
        border:1px solid #CBD5E1; 
        border-radius:4px; 
        font-size:15px; 
    }
    .botao { 
        width:100%; 
        padding:12px; 
        background:#1E3A8A; 
        color:white; border:none; 
        border-radius:4px; 
        font-weight:bold; 
        font-size:16px; 
        cursor:pointer; 
        margin-top:12px; 
    }
    .botao:hover { 
        background:#152a65; 
    }
    .botao-laranja { 
        background:#FF6B00; 
    }
    .botao-laranja:hover { 
        background:#d95800; 
    }
    .grid { 
        display:grid; 
        grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); 
        gap:20px; }
    .badge { 
        padding:4px 10px; 
        border-radius:12px; 
        font-size:12px; 
        font-weight:bold; 
    }
    .badge-azul { 
        background:#DBEAFE; 
        color:#1E40AF; 
    }
    .badge-laranja { 
        background:#FFEDD5; 
        color:#C2410C; 
    }
    .badge-verde { 
        background:#D1FAE5; 
        color:#065F46; 
    }
    </style>
</head>

<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container">
  <h1 class="titulo">Visão Geral</h1>
  <div class="grid">
    <div class="card"><div class="card-titulo">Criados</div><h2 th:text="${counts['CRIADO']?:0}">0</h2><span class="badge badge-azul">Aguardando coleta</span></div>
    <div class="card"><div class="card-titulo">Coletados</div><h2 th:text="${counts['COLETADO']?:0}">0</h2><span class="badge badge-laranja">Coletado</span></div>
    <div class="card"><div class="card-titulo">Em Trânsito</div><h2 th:text="${counts['EM_TRANSITO']?:0}">0</h2><span class="badge badge-laranja">Em rota</span></div>
    <div class="card"><div class="card-titulo">Entregues</div><h2 th:text="${counts['ENTREGUE']?:0}">0</h2><span class="badge badge-verde">Finalizado</span></div>
    <div class="card"><div class="card-titulo">Devolvidos</div><h2 th:text="${counts['DEVOLVIDO']?:0}">0</h2><span class="badge badge-vermelho">Cancelado</span></div>
    <div class="card"><div class="card-titulo">Arquivados</div><h2 th:text="${counts['ARQUIVADO']?:0}">0</h2><span class="badge badge-cinza">Arquivado</span></div>
  </div>

  <div class="card" style="margin-top:20px">
    <h3 class="titulo">Por Loja - INNER JOIN</h3>
    <table class="table">
        <tr th:each="item : ${porLoja}">
            <td th:text="${item.nomeLoja}">Loja Centro</td>
            <td th:text="${item.total}">0</td>
        </tr>
    </table>
  </div>
</div>

  <!-- JOIN por loja
  <h2 style="margin-top:30px">Pacotes por Loja</h2>
  <table>
    <tr th:each="item : ${porLoja}">
        <td th:text="${item[0]}">Nome Loja</td>
        <td th:text="${item[1]}">0</td>
    </tr>
  </table>
  -->
</div>
</body></html>
