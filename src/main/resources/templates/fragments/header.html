
<html xmlns:th="http://www.thymeleaf.org">
    
    <style>
            .navbar-logistica{background:#fff; border-bottom:1px solid #e2e8f0}
    .nav-link-logistica{font-weight:600; color:#475569; padding:8px 14px!important; border-radius:10px}
    .nav-link-logistica:hover, .nav-link-logistica.active{background:#f1f5f9; color:#1e2a5e}
    .btn-orange{background:#f97316; color:#fff; font-weight:700; border-radius:10px; padding:8px 16px}
    .btn-orange:hover{background:#ea580c; color:#fff}
    .search-box{background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:6px 12px}
    .search-box input{border:0; background:transparent; outline:none; font-size:14px; width:200px}

        </style>
        
    <div th:if="${session.perfil == 'ADMIN' or session.perfil == 'OPERADOR'}">
    <a href="/lojas/nova">Cadastrar Loja</a>
    </div>

    <div th:if="${session.perfil == 'ENTREGADOR' or session.perfil == 'OPERADOR' or session.perfil == 'ADMIN'}">
    <a th:href="@{/pacotes/{id}/entregar(id=${pacote.id})}">Entregar com OTP</a>
    </div>
        
    <div th:fragment="header">
    <nav style="background:#1E3A8A; padding:16px 32px; display:flex; justify-content:space-between;">
        
   <div th:if="${session.perfil == 'ADMIN' or session.perfil == 'OPERADOR'}">
    <a href="/lojas/nova">Cadastrar Loja</a>
    </div>
    
    
  <div>
    <a th:href="@{/dashboard}">Dashboard</a>
    <a th:href="@{/pacotes}">Remessas</a>
    <a th:href="@{/pacotes/novo}">Nova Remessa</a>
  </div>
  <div>
   <a th:href="@{/lojas/nova}">Nova Loja</a>
   <a th:href="@{/lojas}">Lojas</a>
   <a th:href="@{/pacotes/rastrear}">Rastrear</a>
   <a th:href="@{/logout}"><button class="btn-sair">Sair</button></a>
  </div>
</nav>
</div>
</html>
