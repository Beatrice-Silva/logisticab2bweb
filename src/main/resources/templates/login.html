<html xmlns:th="http://www.thymeleaf.org">
    <head>
    <title>Login - LogisticaWeb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
 
    
        <style>
* {
        margin:0; 
        padding:0; 
        box-sizing:border-box; 
        font-family:'Segoe UI', Arial, sans-serif; 
    }
    body {
    min-height:100vh; background: linear-gradient(135deg, #1e2a5e 0%, #2a4ab7 100%); display:flex; align-items:center; justify-content:center; padding:20px}
    .card-login{max-width:440px; width:100%; border:0; border-radius:24px; box-shadow: 0 20px 60px rgba(0,0,0,0.2)}
    .btn-orange{background:#f97316; color:#fff; font-weight:700; padding:12px; border-radius:12px}
    .btn-orange:hover{background:#ea580c; color:#fff}
    .input-group-text{background:#f8fafc; border-right:0}
    .form-control{border-left:0; padding:12px}
    .form-control:focus{box-shadow:none; border-color:#dee2e6} 
    
    
    nav { 
        background:#1E3A8A; 
        padding:16px 32px; 
        display:flex; 
        justify-content:space-between; 
        align-items:center; 
    }
    nav a { 
        color:white; 
        text-decoration:none; 
        margin-right:24px; 
        font-weight:500; 
    }
    nav a:hover { 
        color:#FF6B00; 
    }
    .btn-sair { 
        background:#FF6B00; 
        color:white; border:none; 
        padding:8px 16px; 
        border-radius:4px; 
        cursor:pointer; 
        font-weight:bold; 
    }
    .container { 
        max-width:1100px; 
        margin:32px auto; 
        padding:0 16px; 
    }
    .card { 
        background:white; 
        padding:24px; 
        border-radius:8px; 
        box-shadow:0 2px 6px rgba(0,0,0,0.08); 
        border-left:4px solid #1E3A8A; 
        margin-bottom:20px; 
    }
    
    .card-login { 
        max-width:420px; 
        margin:80px auto; 
        text-align:center; 
        border-left:none; 
    }
    .titulo { 
        font-size:22px; 
        color:#1E3A8A; 
        margin-bottom:24px; 
        font-weight:bold; 
    }
    .grupo { 
        text-align:left; 
        margin-bottom:16px; 
    }
    .grupo label { 
        display:block; 
        margin-bottom:6px;
        font-weight:600; 
        font-size:14px; 
    }
    .grupo input, .grupo select { 
        width:100%; 
        padding:12px; 
        border:1px solid #CBD5E1; 
        border-radius:4px; 
        font-size:15px; 
    }
    .botao { 
        width:100%; 
        padding:12px; 
        background:#1E3A8A; 
        color:white; border:none; 
        border-radius:4px; 
        font-weight:bold; 
        font-size:16px; 
        cursor:pointer; 
        margin-top:12px; 
    }
    .botao:hover { 
        background:#152a65; 
    }
    .botao-laranja { 
        background:#FF6B00; 
    }
    .botao-laranja:hover { 
        background:#d95800; 
    }
    .grid { 
        display:grid; 
        grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); 
        gap:20px; }
    .badge { 
        padding:4px 10px; 
        border-radius:12px; 
        font-size:12px; 
        font-weight:bold; 
    }
    .badge-azul { 
        background:#DBEAFE; 
        color:#1E40AF; 
    }
    .badge-laranja { 
        background:#FFEDD5; 
        color:#C2410C; 
    }
    .badge-verde { 
        background:#D1FAE5; 
        color:#065F46; 
    }
    </style> 
    </head>  
    
<body>

<div class="card card-login">
  <div class="card-body p-4 p-md-5">
    <!-- LOGO -->
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 rounded-3 p-3 mb-3" style="width:56px;height:56px">
        <i class="bi bi-box-seam fs-3" style="color:#1e2a5e"></i>
      </div>
      <h3 class="fw-bold mb-1" style="color:#1e2a5e">LogisticaWeb</h3>
      <p class="text-muted small">Sistema logístico de rastreamento</p>
    </div>

    <form th:action="@{/logar}" th:object="${credenciais}" method="post">
      <div class="mb-3">
        <label class="form-label small fw-semibold">E-mail</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" th:field="*{email}" class="form-control" placeholder="admin@logistica.com" required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold">Senha</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" th:field="*{senha}" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-orange w-100">Entrar <i class="bi bi-arrow-right ms-1"></i></button>
    </form>

    
    <div th:if="${param.erro}" class="alert alert-danger d-flex align-items-center gap-2 mt-4 rounded-3" style="background:#fef2f2; border-color:#fecaca; color:#991b1b">
      <i class="bi bi-exclamation-circle"></i>
      <div class="small">E-mail ou senha inválidos</div>
    </div>

    <div class="text-center mt-4">
      <div class="d-flex align-items-center gap-2 my-3">
        <hr class="flex-grow-1"><span class="text-muted small">OU</span><hr class="flex-grow-1">
      </div>
      <a th:href="@{/pacotes/rastrearServico}" class="btn btn-outline-secondary w-100 rounded-3">
        <i class="bi bi-search"></i> Rastrear sem login
      </a>
      <p class="small mt-3 text-muted">Não tem conta? <a th:href="@{/registrar}" style="color:#f97316; font-weight:700; text-decoration:none">Cadastre-se</a></p>
    </div>
  </div>
</div>

</body></html>
