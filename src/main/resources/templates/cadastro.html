<html mlns:th="http://www.thymeleaf.org">
    <head>
        
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>Criar conta - LogisticaWeb</title>
       
       
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
      
    * {
        margin:0; 
        padding:0; 
        box-sizing:border-box; 
        font-family:'Segoe UI', Arial, sans-serif; 
    }

    nav { 
        background:#1E3A8A; 
        padding:16px 32px; 
        display:flex; 
        justify-content:space-between; 
        align-items:center; 
    }
    nav a { 
        color:white; 
        text-decoration:none; 
        margin-right:24px; 
        font-weight:500; 
    }
    nav a:hover { 
        color:#FF6B00; 
    }
    .btn-sair { 
        background:#FF6B00; 
        color:white; border:none; 
        padding:8px 16px; 
        border-radius:4px; 
        cursor:pointer; 
        font-weight:bold; 
    }
    .container { 
        max-width:1100px; 
        margin:32px auto; 
        padding:0 16px; 
    }
    .card { 
        background:white; 
        padding:24px; 
        border-radius:8px; 
        box-shadow:0 2px 6px rgba(0,0,0,0.08); 
        border-left:4px solid #1E3A8A; 
        margin-bottom:20px; 
    }
    
    .card-login { 
        max-width:420px; 
        margin:80px auto; 
        text-align:center; 
        border-left:none; 
    }
    .titulo { 
        font-size:22px; 
        color:#1E3A8A; 
        margin-bottom:24px; 
        font-weight:bold; 
    }
    .grupo { 
        text-align:left; 
        margin-bottom:16px; 
    }
    .grupo label { 
        display:block; 
        margin-bottom:6px;
        font-weight:600; 
        font-size:14px; 
    }
    .grupo input, .grupo select { 
        width:100%; 
        padding:12px; 
        border:1px solid #CBD5E1; 
        border-radius:4px; 
        font-size:15px; 
    }
    .botao { 
        width:100%; 
        padding:12px; 
        background:#1E3A8A; 
        color:white; border:none; 
        border-radius:4px; 
        font-weight:bold; 
        font-size:16px; 
        cursor:pointer; 
        margin-top:12px; 
    }
    .botao:hover { 
        background:#152a65; 
    }
    .botao-laranja { 
        background:#FF6B00; 
    }
    .botao-laranja:hover { 
        background:#d95800; 
    }
    .grid { 
        display:grid; 
        grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); 
        gap:20px; }
    .badge { 
        padding:4px 10px; 
        border-radius:12px; 
        font-size:12px; 
        font-weight:bold; 
    }
    .badge-azul { 
        background:#DBEAFE; 
        color:#1E40AF; 
    }
    .badge-laranja { 
        background:#FFEDD5; 
        color:#C2410C; 
    }
    .badge-verde { 
        background:#D1FAE5; 
        color:#065F46; 
    }
    </style> 
    </head>
  <body>
  <nav>
     <a class="icon-link" th:href="@{/index}">
            Voltar
            <svg xmlns="http://www.w3.org/2000/svg" class="bi" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z"/>
            </svg>
            </a>
      
      
        <a class="icon-link" href="@{/}" style="color:orange">
    <svg xmlns="http://www.w3.org/2000/svg" class="bi" viewBox="0 0 16 16" aria-hidden="true">
    <path d="M8.186 1.113a.5.5 0 0 0-.372 0L1.846 3.5l2.404.961L10.404 2l-2.218-.887zm3.564 1.426L5.596 5 8 5.961 14.154 3.5l-2.404-.961zm3.25 1.7-6.5 2.6v7.922l6.5-2.6V4.24zM7.5 14.762V6.838L1 4.239v7.923l6.5 2.6zM7.443.184a1.5 1.5 0 0 1 1.114 0l7.129 2.852A.5.5 0 0 1 16 3.5v8.662a1 1 0 0 1-.629.928l-7.185 2.874a.5.5 0 0 1-.372 0L.63 13.09a1 1 0 0 1-.63-.928V3.5a.5.5 0 0 1 .314-.464L7.443.184z"/>
    </svg>
    Serviço: EntreExpress
    </a>
   
    </nav>   
      <br>
    <div class="container">
        
    <div class="card" style="max-width:500px; margin:40px auto">
        <h1 class="titulo">Criar conta</h1>
        
        <form th:action="@{/registrar}" th:object="${usuario}" method="post">
            
            
            <div th:if="${sucesso}" style="color:darkgreen;background:#bbf7d0;padding:12px;border-radius:6px;margin-bottom:15px">
            <span th:text="${sucesso}"></span>
            </div>

                
            
            <div class="grupo">
                <label>Nome:</label>
                <input type="text" th:field="*{nome}" placeolder="exemplo@email.com" required>
            </div>
            
            <div class="grupo">
                <label>E-mail:</label>
                <input type="email" th:field="*{email}" placeolder="exemplo@email.com" required>
            </div>
            <div class="grupo">
                <label>Senha:</label>
                <input type="password" th:field="*{senha}" placeolder="********" required>
            </div>
            
            <button style="width:100%" type="submit" class="botao">Cadastrar</button>
            
                <div th:if="${param.erro}" style="color:darkred;background:salmon;padding:12px;border-radius:6px;margin-bottom:15px">
                Email ou senha inválidos
                </div>
            
            
            <div th:if="${erro}" class="alert alert-danger" style="color:darkred;background:salmon;padding:12px;border-radius:6px;margin-top:15px">
                <span th:text="${erro}">Erro</span>
            </div>
            
        </form>
        
        <br>
         
       
        <a class="botao" th:href="@{/rastrearServico}" style="color:white; background:orange" >Rastrear sem login</a>
        
            
          
        
    </div>
</div>
</body>
</html>
