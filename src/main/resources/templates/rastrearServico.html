<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
      body{background: linear-gradient(135deg, #1e2a5e, #2a4ab7); 
           min-height:100vh; display:flex; 
           align-items:center; 
           justify-content:center
      }
  </style>
</head>
<body>
<div class="card border-0 rounded-4 shadow-lg p-4" style="max-width:500px; width:100%">
  <h4 class="fw-bold" style="color:#1e2a5e"><i class="bi bi-search"></i> Rastrear remessa</h4>
  <p class="text-muted small">Acesso público, sem login</p>

  
  <form th:action="@{/pacotes/rastreio}" method="get" class="d-flex gap-2 mt-3">
    <input name="codigo" class="form-control rounded-3" placeholder="Ex: LON-92831" required>
    <button class="btn btn-orange" style="background:#f97316; color:#fff; font-weight:700; border-radius:12px">Buscar</button>
  </form>

  <div th:if="${encontrado != null}">
    <hr>
    <div th:if="${encontrado}" class="alert alert-success rounded-3">
      <b th:text="${pacote.codigoRastreio}">LON-123</b><br>
      <span th:text="${pacote.statusAtual}">EM_TRANSITO</span> 
      <span th:text="${pacote.enderecoDestino}">Rua X</span>
    </div>
    <div th:if="${!encontrado}" class="alert alert-danger rounded-3" th:text="${erro}">Não encontrado</div>
  </div>

  <a th:href="@{/login}" class="btn btn-light w-100 mt-3 rounded-3">Voltar ao login</a>
</div>
</body>
</html>
