<div th:fragment="header">
<nav style="background:#1E3A8A; padding:12px 24px; display:flex; justify-content:space-between; align-items:center;">
  <div style="display:flex; gap:20px; align-items:center;">
    <a th:href="@{/dashboard}" style="color:white; font-weight:bold; text-decoration:none;">📦 EntreExpress</a>
    <a th:href="@{/dashboard}" style="color:white; text-decoration:none;">Dashboard</a>
    <a th:href="@{/pacotes}" style="color:white; text-decoration:none;">Remessas</a>
    
    <!-- SÓ OPERADOR/ADMIN CRIA -->
    <a th:if="${session.perfil == 'ADMIN' or session.perfil == 'OPERADOR'}" th:href="@{/lojas}" style="color:white; text-decoration:none;">Lojas</a>

    <!-- TODOS PODEM VERIFICAR, INCLUSIVE ENTREGADOR -->
    <a th:href="@{/pacotes/rastrear}" style="color:white; text-decoration:none;">Rastrear</a>

  <div>
    <span class="badge" style="border:1px solid #93C5FD; color:#DBEAFE; padding:4px 10px; border-radius:12px;" th:text="${session.perfil}"></span>

  </div>
</nav>
