<html>
    <head>
        <title>Editar Loja Selecionada</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
* {
        margin:0; 
        padding:0; 
        box-sizing:border-box; 
        font-family:'Segoe UI', Arial, sans-serif; 
    }
    body {
        background:#F5F7FA; 
        color:#1E293B; 
        min-height:100vh; 
    }
    
    nav { 
        background:#1E3A8A; 
        padding:16px 32px; 
        display:flex; 
        justify-content:space-between; 
        align-items:center; 
    }
    nav a { 
        color:white; 
        text-decoration:none; 
        margin-right:24px; 
        font-weight:500; 
    }
    nav a:hover { 
        color:#FF6B00; 
    }
    .btn-sair { 
        background:#FF6B00; 
        color:white; border:none; 
        padding:8px 16px; 
        border-radius:4px; 
        cursor:pointer; 
        font-weight:bold; 
    }
    .container { 
        max-width:1100px; 
        margin:32px auto; 
        padding:0 16px; 
    }
    .card { 
        background:white; 
        padding:24px; 
        border-radius:8px; 
        box-shadow:0 2px 6px rgba(0,0,0,0.08); 
        border-left:4px solid #1E3A8A; 
        margin-bottom:20px; 
    }
    
    .card-login { 
        max-width:420px; 
        margin:80px auto; 
        text-align:center; 
        border-left:none; 
    }
    .titulo { 
        font-size:22px; 
        color:#1E3A8A; 
        margin-bottom:24px; 
        font-weight:bold; 
    }
    .grupo { 
        text-align:left; 
        margin-bottom:16px; 
    }
    .grupo label { 
        display:block; 
        margin-bottom:6px;
        font-weight:600; 
        font-size:14px; 
    }
    .grupo input, .grupo select { 
        width:100%; 
        padding:12px; 
        border:1px solid #CBD5E1; 
        border-radius:4px; 
        font-size:15px; 
    }
    .botao { 
        width:100%; 
        padding:12px; 
        background:#1E3A8A; 
        color:white; border:none; 
        border-radius:4px; 
        font-weight:bold; 
        font-size:16px; 
        cursor:pointer; 
        margin-top:12px; 
    }
    .botao:hover { 
        background:#152a65; 
    }
    .botao-laranja { 
        background:#FF6B00; 
    }
    .botao-laranja:hover { 
        background:#d95800; 
    }
    .grid { 
        display:grid; 
        grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); 
        gap:20px; }
    .badge { 
        padding:4px 10px; 
        border-radius:12px; 
        font-size:12px; 
        font-weight:bold; 
    }
    .badge-azul { 
        background:#DBEAFE; 
        color:#1E40AF; 
    }
    .badge-laranja { 
        background:#FFEDD5; 
        color:#C2410C; 
    }
    .badge-verde { 
        background:#D1FAE5; 
        color:#065F46; 
    }
    </style> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container">
  <div class="card">
    <h3 class="titulo">Editar Loja Selecionada</h3>
    <form th:action="@{/lojas/editar/{id}(id=${lojaDTO.idLoja})}" th:object="${lojaDTO}" method="post">
      
      <div class="grupo">
        <label>Nome do Estabelecimento</label>
        <input th:field="*{nomeEstabelecimento}" placeholder="Ex: Supermercado Primavera"/>
      </div>

      <div class="grid" style="grid-template-columns:1fr 1fr;">
        <div class="grupo">
          <label>CNPJ</label>
          <input th:field="*{cnpj}" placeholder="00.000.000/0000-00"/>
        </div>
        <div class="grupo">
          <label>Cidade</label>
          <input th:field="*{cidade}" placeholder="Londrina"/>
        </div>
      </div>

      <div class="grupo">
        <label>Endereço</label>
        <input th:field="*{enderecoDestino}" placeholder="Av. Dez de Dezembro, 1845"/>
      </div>

      <div class="grupo">
        <label>Email de Contato</label>
        <input th:field="*{contatoEmail}" placeholder="contato@loja.com"/>
      </div>

      <div style="display:flex; gap:12px; margin-top:8px;">
        <button type="submit" class="botao botao-laranja" style="flex:1;">Salvar alterações</button>
        <a href="/lojas" class="botao" style="flex:1; text-align:center; text-decoration:none; background:#64748B;">Cancelar</a>
      </div>

    </form>
  </div>
</div>
</body>
</html>
